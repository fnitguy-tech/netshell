# Tag v* (matching the crate versions) to publish mw and netshell for
# Linux, Windows and macOS. Every release carries:
#   - the binaries, with SHA256SUMS next to them
#   - a GitHub build provenance attestation for each binary, so anyone
#     can prove a download was built by this workflow from this commit
#     (gh attestation verify <file> --owner fnitguy-tech)
#   - completed winget manifests, ready to submit to microsoft/winget-pkgs
# and the Scoop bucket in bucket/ is updated on main with the new
# version and hashes. Code signing is deliberately not here yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          for bin in mw netshell; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.ext }}" "dist/$bin-${{ matrix.suffix }}${{ matrix.ext }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/mw-*
            dist/netshell-*
      - name: Render winget manifests and the Scoop bucket
        run: packaging/render.sh "${GITHUB_REF_NAME#v}" dist
      - name: Update the Scoop bucket on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket
          git diff --cached --quiet || git commit -m "scoop: ${GITHUB_REF_NAME}"
          git push origin HEAD:main
      - name: Release notes
        run: |
          {
            echo "## Install"
            echo
            echo '```text'
            echo "winget install fnitguy-tech.mw          # Windows, once the manifest is merged"
            echo "scoop bucket add fnitguy https://github.com/fnitguy-tech/netshell && scoop install mw"
            echo "cargo install mw-check                  # builds locally; gives you the mw binary"
            echo '```'
            echo
            echo "Direct downloads are below. Verify one with its checksum, or prove it was built here:"
            echo
            echo '```text'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify mw-linux-x86_64 --owner fnitguy-tech"
            echo '```'
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*
            packaging/out/winget/*
