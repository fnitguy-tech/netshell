# Tag v* to publish static binaries for Linux, Windows and macOS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: netshell-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: netshell-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: netshell-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/netshell
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
