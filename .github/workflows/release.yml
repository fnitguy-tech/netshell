# Tag v* to publish netshell and mw binaries for Linux, Windows and macOS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Rename binaries
        shell: bash
        run: |
          for bin in netshell mw; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.ext }}" "$bin-${{ matrix.suffix }}${{ matrix.ext }}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            netshell-${{ matrix.suffix }}${{ matrix.ext }}
            mw-${{ matrix.suffix }}${{ matrix.ext }}
