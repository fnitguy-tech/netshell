[package]
name = "mw-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Maintenance window check: capture network device state before and after a change, diff it with expected churn stripped, and report what changed"
readme = "README.md"
keywords = ["network", "maintenance", "arista", "cisco", "panos"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2.12", features = ["serde"] }
indicatif = "0.18"
netshell = { path = "../netshell", version = "0.1.0" }
regex = "1.13"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "mw"
path = "src/main.rs"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
