[package]
name = "mw-check"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Maintenance window check: capture network device state before and after a change, diff it with expected churn stripped, and report what changed"
readme = "README.md"
keywords = ["network", "maintenance", "arista", "cisco", "panos"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
# The redaction rules use lookaheads and a backreference, which the
# regex crate leaves out. fancy-regex runs them the way Python does.
fancy-regex = "0.19"
indexmap = { version = "2.12", features = ["serde"] }
indicatif = "0.18"
# mw has its own command line, so it leaves out netshell's `cli`
# feature (clap, rpassword, and the Windows icon step for that binary).
netshell = { path = "../netshell", version = "0.3.0", default-features = false }
regex = "1.13"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# `mw demo` unpacks its bundled captures into a private temp folder.
tempfile = "3.23"
thiserror = "2.0"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[[bin]]
name = "mw"
path = "src/main.rs"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
